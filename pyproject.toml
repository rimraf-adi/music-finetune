[project]
name = "music-ref-tracking"
version = "0.1.0"
description = "Reference-Tracking Closed-Loop Music Generation via GRPO"
requires-python = ">=3.10"
dependencies = [
    # Core
    "torch>=2.1.0",
    "torchaudio>=2.1.0",

    # MIDI processing
    "pretty-midi>=0.2.10",
    "miditoolkit>=1.0.1",
    "mido>=1.3.0",

    # Data / ML
    "numpy>=1.24.0",
    "scipy>=1.11.0",
    "scikit-learn>=1.3.0",
    "transformers>=4.35.0",
    "peft>=0.7.0",

    # Logging
    "wandb>=0.16.0",
    "tqdm>=4.66.0",

    # Visualization
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",

    # Utilities
    "requests>=2.31.0",
    "gdown>=5.1.0",
]

[tool.uv]
dev-dependencies = [
    "pytest>=7.4.0",
    "ipython>=8.0.0",
]
